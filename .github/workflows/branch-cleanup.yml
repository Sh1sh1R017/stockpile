name: One-time branch cleanup

on:
  push:
    paths:
      - ".github/workflows/branch-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches already merged into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          branches=(
            "feat/reference-editing-v2"
            "feat/reference-edit-refinement-v3"
            "fix/reference-caption-and-hero-timing"
            "feat/reference-editing-guidelines"
            "feat/cinematic-social-editing-guideline"
            "feature/opening-hook-text-behind-subject"
            "fix/openreel-timeline-sync"
            "feat/emotion-aware-broll"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting merged branch: ${branch}"
            gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}" || true
          done

      - name: Remove this one-time cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          path=".github/workflows/branch-cleanup.yml"
          sha="$(gh api "repos/${repo}/contents/${path}" --jq '.sha')"
          gh api --method DELETE "repos/${repo}/contents/${path}"             -f message="chore: remove one-time branch cleanup workflow"             -f sha="${sha}"             -f branch="main"

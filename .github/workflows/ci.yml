name: Stockpile CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: stockpile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff mypy

      - name: Import smoke test
        run: python -m pytest -q tests/test_import_smoke.py

      - name: Python tests
        run: python -m pytest -q

      - name: Ruff bug rules
        run: ruff check ai_broll_autopilot tests --select F,B

      - name: Mypy baseline
        continue-on-error: true
        run: mypy ai_broll_autopilot --config-file pyproject.toml

  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install lint tooling
        run: npm install --no-save eslint@8.57.1 eslint-config-next@15.2.1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  ffmpeg-smoke:
    name: FFmpeg smoke render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Smoke render
        run: python -m pytest -q -m ffmpeg tests/test_ffmpeg_smoke.py

name: Stockpile CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: stockpile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt pytest
      - name: Python tests
        run: python -m pytest -q

  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  ffmpeg-smoke:
    name: FFmpeg smoke render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest and FFmpeg
        run: |
          python -m pip install --upgrade pip pytest
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run FFmpeg tests when present
        run: |
          if [ -f tests/test_ffmpeg_smoke.py ]; then
            python -m pytest -q -m ffmpeg tests/test_ffmpeg_smoke.py
          else
            echo "No FFmpeg smoke test in baseline; skipping."
          fi

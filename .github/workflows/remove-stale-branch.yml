name: Remove final stale branch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/remove-stale-branch.yml"

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/feat/zapcap-style-workflow"
      - name: Delete this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${{ github.repository }}/contents/.github/workflows/remove-stale-branch.yml" --jq '.sha')"
          gh api --method DELETE "repos/${{ github.repository }}/contents/.github/workflows/remove-stale-branch.yml"             -f message="chore: finish three branch cleanup"             -f sha="${sha}"             -f branch="main"
